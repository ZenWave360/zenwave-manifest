<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZenWave Manifest</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f1e8;
      --panel: #fffdf8;
      --ink: #1f2a37;
      --accent: #005f73;
      --muted: #5b6770;
      --border: #d9d3c7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(180deg, #efe7d7 0%, var(--bg) 100%);
      color: var(--ink);
    }
    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 20px 72px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 12px 28px rgba(31, 42, 55, 0.08);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1;
      letter-spacing: -0.03em;
    }
    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }
    a {
      color: var(--accent);
      text-decoration-thickness: 2px;
      text-underline-offset: 2px;
    }
    ul {
      padding-left: 20px;
      line-height: 1.8;
    }
    code, pre {
      font-family: "Courier New", monospace;
    }
    pre {
      overflow-x: auto;
      padding: 14px;
      border-radius: 12px;
      background: #f3efe6;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>ZenWave Manifest</h1>
      <p>Versioned manifest schemas and shared parsing contracts for ZenWave workspace tooling.</p>
      <ul>
        <li><a href="/zenwave-architecture/1.0/schema.json">zenwave-architecture 1.0</a></li>
        <li><a href="/zenwave-architecture/latest/schema.json">zenwave-architecture latest</a></li>
      </ul>
      <pre># yaml-language-server: $schema=https://schemas.zenwave360.io/zenwave-architecture/1.0/schema.json</pre>
    </section>
  </main>
</body>
</html>
